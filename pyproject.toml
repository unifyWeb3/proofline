[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofline"
version = "0.1.0"
description = "GenLayer-native semantic acceptance core"
requires-python = ">=3.12"
dependencies = [
  "eth-account>=0.10,<0.14",
]

[project.optional-dependencies]
direct = [
  "genlayer-py==0.16.3",
  "genlayer-test==0.29.2",
]

[tool.setuptools.packages.find]
include = ["proofline*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/direct"]
pythonpath = ["."]
markers = [
  "direct: official GenLayer in-memory direct-mode contract test",
]
